name: Update KOREA MAP

on:
  schedule:
    # Intraday: every 30 minutes while the KRX is open.
    # 00:00-06:30 UTC = 09:00-15:30 KST, Mon-Fri
    - cron: '0,30 0-6 * * 1-5'
    # Confirmed close: 07:30 UTC = 16:30 KST
    - cron: '30 7 * * 1-5'
    # Retry if the close run failed: 09:30 UTC = 18:30 KST
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: |
          mkdir -p site
          set +e
          python -m pip install --upgrade pip > pip.log 2>&1
          pip install yfinance pandas >> pip.log 2>&1
          rc=$?
          echo "=== pip exit code: $rc ===" >> pip.log
          python -c "import yfinance, pandas; print('import ok'); print('pandas', pandas.__version__)" >> pip.log 2>&1
          echo "=== import exit code: $? ===" >> pip.log
          cp pip.log site/_pip.txt
          tail -25 pip.log
          exit $rc

      - name: Self-test the fetcher
        if: steps.deps.outcome == 'success'
        run: python fetch_yahoo.py --self-test

      - name: Fetch prices and build page
        id: fetch
        continue-on-error: true
        if: steps.deps.outcome == 'success'
        run: |
          mkdir -p site
          set +e
          python fetch_yahoo.py --out site > fetch.log 2>&1
          rc=$?
          echo "=== script exit code: $rc ===" >> fetch.log
          cp fetch.log site/_fetch.txt
          tail -60 fetch.log
          exit $rc

      - name: Fallback - build page from data already in the repository
        if: steps.fetch.outcome != 'success'
        run: |
          echo "Fetch was not successful. Deploying with the stored data instead."
          mkdir -p site
          cp data.json site/data.json
          python -c "t=open('korea_map_template.html',encoding='utf-8').read();d=open('data.json',encoding='utf-8').read();h=t.replace('__DATA__',d);open('site/index.html','w',encoding='utf-8').write(h);open('site/korea_map.html','w',encoding='utf-8').write(h)"
          echo "deps=${{ steps.deps.outcome }} fetch=${{ steps.fetch.outcome }}" > site/_status.txt

      - name: Verify output before deploying
        run: |
          test -s site/index.html || { echo "index.html was not generated"; exit 1; }
          python verify_data.py site/data.json

      - name: Save data.json for the next run
        # Intraday runs do not commit - only the close run and manual runs do,
        # so the repository keeps roughly one data commit per trading day.
        if: steps.fetch.outcome == 'success' && github.event.schedule != '0,30 0-6 * * 1-5'
        run: |
          cp site/data.json data.json
          if git diff --quiet -- data.json; then
            echo "No data change - skipping commit"
          else
            git config user.name  "korea-map-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json
            git commit -m "Update market data $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
