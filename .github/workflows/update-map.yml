name: Update KOREA MAP

# Fixed schedule. No self-triggering chain.
# Times below are UTC. KST = UTC + 9.
#
#   '7 0-6 * * 1-5'   ->  09:07, 10:07, 11:07 ... 15:07 KST  (7 runs)
#   '37 0-6 * * 1-5'  ->  09:37, 10:37, 11:37 ... 15:37 KST  (7 runs)
#   '47 6 * * 1-5'    ->  15:47 KST, confirmed close, this run commits data.json
#
# The two intraday lines are written separately on purpose. A single line
# with a comma list ('7,37 0-6 * * 1-5') did not register reliably.
# The single-minute form has a confirmed history of firing on this repository.
#
# Minutes :07, :37 and :47 are used instead of :00 and :30 on purpose.
# :00 and :30 are GitHub's peak-load minutes and scheduled runs are
# frequently delayed or dropped there.
#
# If one slot is skipped by GitHub, only that slot is lost. The next slot
# runs normally 30 minutes later. Nothing has to be restarted by hand.

on:
  schedule:
    - cron: '7 0-6 * * 1-5'
    - cron: '37 0-6 * * 1-5'
    - cron: '47 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: |
          mkdir -p site
          set +e
          python -m pip install --upgrade pip > pip.log 2>&1
          pip install yfinance pandas >> pip.log 2>&1
          rc=$?
          echo "=== pip exit code: $rc ===" >> pip.log
          python -c "import yfinance, pandas; print('import ok'); print('pandas', pandas.__version__)" >> pip.log 2>&1
          echo "=== import exit code: $? ===" >> pip.log
          cp pip.log site/_pip.txt
          tail -25 pip.log
          exit $rc

      - name: Self-test the fetcher
        if: steps.deps.outcome == 'success'
        run: python fetch_yahoo.py --self-test

      - name: Fetch prices and build page
        id: fetch
        continue-on-error: true
        if: steps.deps.outcome == 'success'
        run: |
          mkdir -p site
          set +e
          python fetch_yahoo.py --out site > fetch.log 2>&1
          rc=$?
          echo "=== script exit code: $rc ===" >> fetch.log
          cp fetch.log site/_fetch.txt
          tail -60 fetch.log
          exit $rc

      - name: Fallback - build page from data already in the repository
        if: steps.fetch.outcome != 'success'
        run: |
          echo "Fetch was not successful. Deploying with the stored data instead."
          mkdir -p site
          cp data.json site/data.json
          python -c "t=open('korea_map_template.html',encoding='utf-8').read();d=open('data.json',encoding='utf-8').read();h=t.replace('__DATA__',d);open('site/index.html','w',encoding='utf-8').write(h);open('site/korea_map.html','w',encoding='utf-8').write(h)"
          echo "deps=${{ steps.deps.outcome }} fetch=${{ steps.fetch.outcome }}" > site/_status.txt

      - name: Verify output before deploying
        run: |
          test -s site/index.html || { echo "index.html was not generated"; exit 1; }
          python verify_data.py site/data.json

      - name: Save data.json for the next run
        # Commit once a day on the 15:47 KST close run, or on a manual run.
        # Intraday runs deploy the site but do not commit, to keep history small.
        if: >-
          steps.fetch.outcome == 'success' &&
          ( github.event.schedule == '47 6 * * 1-5' ||
            github.event_name == 'workflow_dispatch' )
        run: |
          cp site/data.json data.json
          if git diff --quiet -- data.json; then
            echo "No data change - skipping commit"
          else
            git config user.name  "korea-map-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json
            git commit -m "Update market data $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### KOREA MAP updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }} ${{ github.event.schedule }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run time: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" >> $GITHUB_STEP_SUMMARY
