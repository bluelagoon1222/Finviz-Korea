name: Update KOREA MAP

# How this keeps a steady ~30 minute cadence during market hours:
#   GitHub's own cron is often delayed or skipped, so it is only used as a
#   watchdog. Each run re-triggers itself (workflow_dispatch) after waiting
#   28 minutes while the KRX is open (Mon-Fri 08:30-15:00 KST start window).
#   Cron minutes avoid :00/:30, which are GitHub's peak-load minutes.
#
# Times below are UTC. KST = UTC + 9.

on:
  schedule:
    - cron: '7 0-6 * * 1-5'     # watchdog: 09:07 ... 15:07 KST, restarts the chain if it died
    - cron: '33 7 * * 1-5'      # 16:33 KST confirmed close
    - cron: '33 9 * * 1-5'      # 18:33 KST retry
  workflow_dispatch:
    inputs:
      chain:
        description: 'internal - set by the workflow itself'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: |
          mkdir -p site
          set +e
          python -m pip install --upgrade pip > pip.log 2>&1
          pip install yfinance pandas >> pip.log 2>&1
          rc=$?
          echo "=== pip exit code: $rc ===" >> pip.log
          python -c "import yfinance, pandas; print('import ok'); print('pandas', pandas.__version__)" >> pip.log 2>&1
          echo "=== import exit code: $? ===" >> pip.log
          cp pip.log site/_pip.txt
          tail -25 pip.log
          exit $rc

      - name: Self-test the fetcher
        if: steps.deps.outcome == 'success'
        run: python fetch_yahoo.py --self-test

      - name: Fetch prices and build page
        id: fetch
        continue-on-error: true
        if: steps.deps.outcome == 'success'
        run: |
          mkdir -p site
          set +e
          python fetch_yahoo.py --out site > fetch.log 2>&1
          rc=$?
          echo "=== script exit code: $rc ===" >> fetch.log
          cp fetch.log site/_fetch.txt
          tail -60 fetch.log
          exit $rc

      - name: Fallback - build page from data already in the repository
        if: steps.fetch.outcome != 'success'
        run: |
          echo "Fetch was not successful. Deploying with the stored data instead."
          mkdir -p site
          cp data.json site/data.json
          python -c "t=open('korea_map_template.html',encoding='utf-8').read();d=open('data.json',encoding='utf-8').read();h=t.replace('__DATA__',d);open('site/index.html','w',encoding='utf-8').write(h);open('site/korea_map.html','w',encoding='utf-8').write(h)"
          echo "deps=${{ steps.deps.outcome }} fetch=${{ steps.fetch.outcome }}" > site/_status.txt

      - name: Verify output before deploying
        run: |
          test -s site/index.html || { echo "index.html was not generated"; exit 1; }
          python verify_data.py site/data.json

      - name: Save data.json for the next run
        # Commit once a day (close run / retry) or on a manual run - never on chain runs.
        if: >-
          steps.fetch.outcome == 'success' &&
          ( github.event.schedule == '33 7 * * 1-5' ||
            github.event.schedule == '33 9 * * 1-5' ||
            ( github.event_name == 'workflow_dispatch' && inputs.chain != 'true' ) )
        run: |
          cp site/data.json data.json
          if git diff --quiet -- data.json; then
            echo "No data change - skipping commit"
          else
            git config user.name  "korea-map-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json
            git commit -m "Update market data $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  schedule-next:
    # Keeps the intraday chain alive. Only one chain job exists at a time:
    # a newer one cancels the older sleeping one.
    needs: build-and-deploy
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: chain
      cancel-in-progress: true
    steps:
      - name: Is the KRX still open? (KST)
        id: mk
        run: |
          dow=$(TZ=Asia/Seoul date '+%u')      # 1=Mon ... 7=Sun
          hm=$(TZ=Asia/Seoul date '+%H%M')
          echo "now KST: weekday=$dow time=$hm"
          if [ "$dow" -le 5 ] && [ "$hm" -ge 0830 ] && [ "$hm" -le 1500 ]; then
            echo "open=true"  >> "$GITHUB_OUTPUT"; echo "market open -> next run in 28 minutes"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"; echo "market closed -> chain stops here"
          fi

      - name: Wait 28 minutes
        if: steps.mk.outputs.open == 'true'
        run: sleep 1680

      - name: Trigger the next run
        if: steps.mk.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-map.yml --ref main -f chain=true --repo "${{ github.repository }}"
