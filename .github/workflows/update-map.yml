name: Update KOREA MAP

# Runs every weekday after the KRX close and redeploys the site.
# Times are UTC. KST = UTC + 9.
#   07:30 UTC = 16:30 KST  (main run)
#   09:30 UTC = 18:30 KST  (retry in case the main run failed)

on:
  schedule:
    - cron: '30 7 * * 1-5'
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Base date YYYYMMDD (leave empty for the latest trading day)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch KRX data and build page
        run: |
          python update_korea_map.py \
            --backend pykrx \
            --out site \
            ${{ inputs.date != '' && format('--date {0}', inputs.date) || '' }}

      - name: Verify output before deploying
        run: |
          test -s site/index.html || { echo "index.html was not generated"; exit 1; }
          python verify_data.py site/data.json

      - name: Save data.json as the fallback for the next run
        run: |
          cp site/data.json data.json
          if git diff --quiet -- data.json; then
            echo "No data change (market holiday, etc.) - skipping commit"
          else
            git config user.name  "korea-map-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json
            git commit -m "Update market data $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### KOREA MAP updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Site: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run time: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" >> $GITHUB_STEP_SUMMARY
